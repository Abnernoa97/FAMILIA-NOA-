name: Archive signed FAMILIA NOA 7.1.4 and prune temporary GPS branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-gps-714-archive.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: 510486e1e45f2c075137395650b9760c74e28f06
      FEATURE_SHA: 888ab5cebab2df31efd044c47517927c9c283177
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed APK and publish permanent release
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(git show "$RELEASE_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionName = "7.1.4"')" -eq 1
          test "$(git show "$RELEASE_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionCode = 13')" -eq 1
          mkdir -p "$RUNNER_TEMP/gps-release"
          gh run download 39688956662 -n familia-noa-permanent-signed-apk -D "$RUNNER_TEMP/gps-release"
          mapfile -t files < <(find "$RUNNER_TEMP/gps-release" -type f -name app-release.apk)
          test "${#files[@]}" -eq 1
          apk="${files[0]}"
          test -s "$apk"
          test -s "$apk.sha256"
          test "$(sha256sum "$apk" | cut -d' ' -f1)" = "$(awk 'NR==1 {print $1}' "$apk.sha256")"
          out="$RUNNER_TEMP/familia-noa-7.1.4.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          gh release create v7.1.4 "$out" "$out.sha256" --target "$RELEASE_SHA" --title "FAMILIA NOA 7.1.4 · GPS" --notes "Actualización GPS Android firmada permanentemente. Mismo paquete y certificado que 7.1.2/7.1.3. Incluye diagnóstico nativo, suspensión local antes de borrar en la nube y recuperación de privacidad. Compilación GitHub Actions 39688956662. Pendiente prueba funcional en teléfonos reales."
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v7.1.4" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view v7.1.4 --json assets --jq '.assets[].name' | grep -qx 'familia-noa-7.1.4.apk'
          gh release view v7.1.4 --json assets --jq '.assets[].name' | grep -qx 'familia-noa-7.1.4.apk.sha256'
      - name: Delete merged temporary GPS branch only
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          branch='fix/gps-privacy-true-status-714'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$FEATURE_SHA"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
          echo 'Temporary merged branch deleted; main and HAVANA QUOTES story experiment retained.'
