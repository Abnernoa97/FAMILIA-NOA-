name: One-time FAMILIA NOA recovery and branch cleanup

# One-off maintenance: no application, administrator, or story files are changed.
# Abort without deleting any branch unless BOTH signed Android releases exist.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-recovery-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  secure-and-clean:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_712: a74e14f34ff3160db5525b18eaf254390e6d2cb6
      VERSION_713: 763b98bdfeb06de3093e7f936e64985baea9fb4a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm canonical Android versions and untouched app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$VERSION_713"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          git show "$VERSION_712:android-emergency/app/build.gradle.kts" | grep -q 'versionName = "7.1.2"'
          git show "$VERSION_713:android-emergency/app/build.gradle.kts" | grep -q 'versionName = "7.1.3"'
          git diff --quiet "$VERSION_713" HEAD -- src admin android-emergency public worker index.html package.json
          test -f admin/index.html
          test -f src/home-stories.ts
          echo 'Canonical versions confirmed; app, admin and story experiments untouched.'

      - name: Download and publish permanently signed APK versions
        shell: bash
        run: |
          set -euo pipefail
          for spec in "7.1.2|39380195920|$VERSION_712" "7.1.3|39674028078|$VERSION_713"; do
            IFS='|' read -r version run_id sha <<< "$spec"
            tag="v$version"
            out="$RUNNER_TEMP/familia-noa-$version"
            mkdir -p "$out/download"
            gh run download "$run_id" -n familia-noa-permanent-signed-apk -D "$out/download"
            mapfile -t files < <(find "$out/download" -type f -name app-release.apk)
            test "${#files[@]}" -eq 1
            source_apk="${files[0]}"
            source_checksum="$source_apk.sha256"
            test -s "$source_apk"
            test -s "$source_checksum"
            actual="$(sha256sum "$source_apk" | cut -d' ' -f1)"
            expected="$(awk 'NR==1 {print $1}' "$source_checksum")"
            test "$actual" = "$expected"
            apk="$out/familia-noa-$version.apk"
            cp "$source_apk" "$apk"
            printf '%s  %s\n' "$actual" "$(basename "$apk")" > "$apk.sha256"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" "$apk" "$apk.sha256" --target "$sha" --title "FAMILIA NOA $version (Android, firma permanente)" --notes "Android oficial $version. APK firmado, compilado en GitHub Actions run #$run_id. Fuente exacta: $sha. Mantener para recuperación y actualización."
            else
              gh release upload "$tag" "$apk" "$apk.sha256" --clobber
            fi
            test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "familia-noa-$version.apk"
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "familia-noa-$version.apk.sha256"
            echo "Permanent release $tag verified: $sha"
          done

      - name: Confirm exact 25 stale branches before any deletion
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/branches-to-remove.tsv" <<'BRANCHES'
54a1f5199d7e14daf46c911cd69d0a6b6598a56b	feature/cinematic-3d-g1
2a6b6a8dda49eeaf0f7593b96adff130d8be9a48	feature/cinematic-3d-materials-streets
0f9a2b7719a84107f907dd3d08e74480f857d862	feature/family-location-start-notifications
7f9ae4e08e90391d0bc3316dd6bb71ac3694facc	feature/family-unified-notifications-7-1
e336655ec9a288117d311d514770943425bdbd32	fix/android-location-settings-and-confirmation-711
2b5a38b66516d0a7706d6d4bb5843be2c7bc2228	fix/cinematic-3d-map-fluidity
857f1988ae5bf5884758bede6701fc66dfd5e3c1	fix/cinematic-camera-real-family-focus
2e531992645e6d19e253485f8f8efc87b179ca81	fix/dynamic-map-live-members-page-scroll
3e1d1a52895705d62103fa3d64e29c4e897d6fef	fix/gps-original-gestures-dynamic-space-member-pills
41a635d1d938b9e1d0f3b7ec60e95cd3ff345423	fix/instant-stable-android-startup-712
2db3114dadc0c81d695b9d89a9be3915965756b7	fix/location-member-focus-no-flight
5ab40f9fa4db28859dc2e7c620246ac79b9be2a4	fix/location-recovery-visible-gps-off
f7196bb8b3d2c2dc092a05e3568c04b640c90335	fix/location-stale-sharing-count
b39be625524de45e3298ae3a32076a0977b8e1b1	fix/map-fast-first-render
667f101d0f8774fe836138c756a8c82fcd60d148	fix/map-member-visibility-selection
53cb8df42c1451a16d7e1d0ac2acc208ecc569f1	fix/native-location-stationary-heartbeat
725bc4f49d23505a922d0f520a2036354a5e06a5	fix/persistent-magazine-like-havana-quotes
80eae7b0fbb59e023824520d4c0b04cdab07dbeb	fix/realtime-reconnect-stability-713
2302ba8a43e40fb1dfa054ec7cff0a53b8bc1d7e	fix/restore-fast-3d-map-owner
9d17e4aafc48a523619f0fb34ce2704a71956156	fix/restore-working-location-map
2ea80fdc9babedb5e14d5d32e7de864ab8981de4	fix/stories-progress-magazine-performance-20261020
3465082e139345837238ba9e1e0965f7bc9d5285	fix/stories-single-page-magazine-surface-20261020
9e0c4477f78a2f9a22f658f78167c8bea3b89b5a	fix/stories-taps-havana-quotes-page-flip
c2980530f03a48ee475d11e0d817c50c10c63611	perf/stories-lightweight-page-turn-20261020
241627289aca9759da63d99c11c6325ea1e2933c	ui/larger-family-map-no-duplicate-chips
BRANCHES
          test "$(wc -l < "$RUNNER_TEMP/branches-to-remove.tsv")" -eq 25
          while IFS=$'\t' read -r original branch; do
            test "$branch" != "main"
            test "$branch" != "fix/stories-persistent-havana-quotes-book"
            now="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$now" != "$original" ]; then
              echo "::error::Branch moved: $branch ($original -> $now). Nothing deleted."
              exit 1
            fi
          done < "$RUNNER_TEMP/branches-to-remove.tsv"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          echo 'All candidate branches unchanged. Preserved: main and unfinished HAVANA QUOTES page-flip experiment.'

      - name: Remove only 25 old merged branches
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r original branch; do
            now="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            test "$now" = "$original"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
            echo "Deleted redundant branch: $branch"
          done < "$RUNNER_TEMP/branches-to-remove.tsv"
          gh api "repos/$GH_REPO/git/ref/heads/main" >/dev/null
          gh api "repos/$GH_REPO/git/ref/heads/fix/stories-persistent-havana-quotes-book" >/dev/null
          echo 'Cleanup complete. Main and unmerged page-flip experiment preserved.'
