name: Remove merged simple GPS branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-prune-gps-simple.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MERGED_HEAD: 89cc82ad61a38d7e45e1a22eb65c0d639dc0ca2d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify integration and remove only temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MERGED_HEAD" HEAD
          branch='fix/gps-simple-toggle-no-flicker-717'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$MERGED_HEAD"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
          echo 'Temporary merged GPS branch removed; main and story experiment preserved.'
