name: Remove merged temporary performance branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-prune-observer-branch.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MERGED_HEAD: 8f5dfa6fed7929dcb9858f53ca867c40e5284638
      STALE_BRANCH: perf/observer-dedup-safe-20261021
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merge and remove exactly one temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MERGED_HEAD" HEAD
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$STALE_BRANCH" --jq '.object.sha')" = "$MERGED_HEAD"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$STALE_BRANCH" >/dev/null
          echo 'Merged temporary performance branch removed. Official and story experiment branches untouched.'
