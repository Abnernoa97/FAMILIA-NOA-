name: Build FAMILIA NOA Stable Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android-emergency/**
      - .github/workflows/android-emergency.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: "2C:56:46:10:C1:D7:C7:B4:72:8C:69:D4:FD:E7:76:FE:2D:89:DF:4E:DE:B2:06:95:33:75:DA:E9:C0:B7:AC:EF"
      FAMILIA_NOA_KEYSTORE_PATH: "${{ github.workspace }}/familia-noa-release.p12"
      FAMILIA_NOA_KEYSTORE_PASSWORD: "${{ secrets.FAMILIA_NOA_ANDROID_SIGNING_PASSWORD }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify permanent signing secrets
        shell: bash
        env:
          SIGNING_KEY_B64: "${{ secrets.FAMILIA_NOA_ANDROID_SIGNING_KEY_BASE64 }}"
          SIGNING_PASSWORD: "${{ secrets.FAMILIA_NOA_ANDROID_SIGNING_PASSWORD }}"
        run: |
          if [ -z "$SIGNING_KEY_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Permanent Android signing is not configured. Refusing to build an APK that cannot update the installed app."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$FAMILIA_NOA_KEYSTORE_PATH"

      - name: Verify signing certificate
        shell: bash
        run: |
          ACTUAL=$(keytool -list -v             -keystore "$FAMILIA_NOA_KEYSTORE_PATH"             -storetype PKCS12             -alias familia-noa-release             -storepass "$FAMILIA_NOA_KEYSTORE_PASSWORD"             | sed -n 's/.*SHA256: //p' | head -n1)
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Wrong Android signing key. Build blocked to prevent an incompatible update."
            exit 1
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed release APK
        shell: bash
        run: |
          gradle --project-dir android-emergency :app:assembleRelease --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="android-emergency/app/build/outputs/apk/release/app-release.apk"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          CERT=$(/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':')
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::Final APK certificate does not match the permanent FAMILIA NOA signing certificate."
            exit 1
          fi
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | head -n1

      - name: Upload stable update APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-noa-stable-update-apk
          path: android-emergency/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
