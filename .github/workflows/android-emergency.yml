name: Build FAMILIA NOA Emergency APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-emergency/**'
      - '.github/workflows/android-emergency.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android SDK 35
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build emergency APK
        run: gradle --project-dir android-emergency :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: familia-noa-emergency-apk
          path: android-emergency/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
