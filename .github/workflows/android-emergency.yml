name: Build FAMILIA NOA Emergency APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-emergency/**'
      - '.github/workflows/android-emergency.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build emergency APK
        run: gradle --project-dir android-emergency :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: familia-noa-emergency-apk
          path: android-emergency/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
