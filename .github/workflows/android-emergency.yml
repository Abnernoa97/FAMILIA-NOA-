name: Build FAMILIA NOA Unified Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android-emergency/**
      - .github/workflows/android-emergency.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 35
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unified APK
        shell: bash
        run: |
          gradle --project-dir android-emergency :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-noa-unified-apk
          path: android-emergency/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
