name: Archive verified FAMILIA NOA 7.1.5 signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-archive-gps-715.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_SHA: 84fc5818521ffe5ec01d2703e14f325c1d652bc5
      FEATURE_SHA: 1deafc8feb72ea5255f9029f62b399d937104cdc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive validated signed build
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VERSION_SHA" HEAD
          test "$(git show "$VERSION_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionName = "7.1.5"')" -eq 1
          test "$(git show "$VERSION_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionCode = 14')" -eq 1
          mkdir -p "$RUNNER_TEMP/family-715"
          gh run download 39693067114 -n familia-noa-permanent-signed-apk -D "$RUNNER_TEMP/family-715"
          mapfile -t apks < <(find "$RUNNER_TEMP/family-715" -type f -name app-release.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test -s "$apk"
          test -s "$apk.sha256"
          expected="$(awk 'NR==1 {print $1}' "$apk.sha256")"
          actual="$(sha256sum "$apk" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          cp "$apk" "$RUNNER_TEMP/familia-noa-7.1.5.apk"
          printf '%s  familia-noa-7.1.5.apk\n' "$actual" > "$RUNNER_TEMP/familia-noa-7.1.5.apk.sha256"
          gh release create v7.1.5 "$RUNNER_TEMP/familia-noa-7.1.5.apk" "$RUNNER_TEMP/familia-noa-7.1.5.apk.sha256" --target "$VERSION_SHA" --title "FAMILIA NOA 7.1.5 · Reparación GPS" --notes "APK firmado permanentemente. Session sync Android/WebView y corrección de renovación de credenciales; versión actualizable encima de 7.1.4, prueba de GPS real pendiente. Código exacto: $VERSION_SHA. GitHub Actions 39693067114."
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v7.1.5" --jq '.object.sha')" = "$VERSION_SHA"
          gh release view v7.1.5 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.5.apk
          gh release view v7.1.5 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.5.apk.sha256
      - name: Remove merged temporary GPS session repair branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          branch='fix/gps-shared-auth-refresh-715'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$FEATURE_SHA"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
          echo 'Only merged GPS repair branch removed; main and story experimental branch preserved.'
