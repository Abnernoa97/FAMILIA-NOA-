name: Archive signed GPS 7.1.7 and remove temporary branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-archive-gps-717.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ff0e28f08a527d761365379ccf8e32b7fc995f9d
      FEATURE_SHA: 7528ff31561128d3bec748471f3c4331d3babb5a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify APK identity and archive permanent signed release
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          test "$(git show "$RELEASE_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionName = "7.1.7"')" -eq 1
          test "$(git show "$RELEASE_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionCode = 16')" -eq 1
          mkdir -p "$RUNNER_TEMP/familia-noa-717"
          gh run download 39702903146 -n familia-noa-permanent-signed-apk -D "$RUNNER_TEMP/familia-noa-717"
          mapfile -t files < <(find "$RUNNER_TEMP/familia-noa-717" -type f -name app-release.apk)
          test "${#files[@]}" -eq 1
          source_apk="${files[0]}"
          test -s "$source_apk"
          test -s "$source_apk.sha256"
          expected="$(awk 'NR==1 {print $1}' "$source_apk.sha256")"
          actual="$(sha256sum "$source_apk" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          target="$RUNNER_TEMP/familia-noa-7.1.7.apk"
          cp "$source_apk" "$target"
          printf '%s  familia-noa-7.1.7.apk\n' "$actual" > "$target.sha256"
          gh release create v7.1.7 "$target" "$target.sha256" --target "$RELEASE_SHA" --title "FAMILIA NOA 7.1.7 · GPS rápido" --notes "APK Android firmado permanentemente (versionCode 16). Instalable encima de 7.1.6 con mismos datos y certificado. Primera posición más rápida: solicitudes GPS y NETWORK simultáneas, red precisa corroborada, reintentos rápidos solo hasta primera transmisión. Sin utilizar ubicaciones históricas. Pendiente validación de latencia real en teléfono. Código exacto: $RELEASE_SHA. Build original: GitHub Actions 39702903146."
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v7.1.7" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view v7.1.7 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.7.apk
          gh release view v7.1.7 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.7.apk.sha256
      - name: Remove merged temporary GPS performance branch only
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          branch='perf/gps-first-current-fix-717'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$FEATURE_SHA"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
          echo 'Temporary GPS branch removed; main and HAVANA QUOTES experiments retained.'
