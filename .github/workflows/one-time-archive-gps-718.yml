name: Archive signed GPS 7.1.8 and clean verified branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-archive-gps-718.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_SHA: b3b864de6688510e99c41959bdc5eac941f52d16
      FEATURE_SHA: 338b6a755bc8cdc28c19d383c2f763f912b15b8e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive SHA-256 checked signed Android 7.1.8
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VERSION_SHA" HEAD
          test "$(git show "$VERSION_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionName = "7.1.8"')" -eq 1
          test "$(git show "$VERSION_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionCode = 17')" -eq 1
          mkdir -p "$RUNNER_TEMP/gps-718"
          gh run download 39705604871 -n familia-noa-permanent-signed-apk -D "$RUNNER_TEMP/gps-718"
          mapfile -t apks < <(find "$RUNNER_TEMP/gps-718" -type f -name app-release.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test -s "$apk"
          test -s "$apk.sha256"
          expected="$(awk 'NR==1 {print $1}' "$apk.sha256")"
          actual="$(sha256sum "$apk" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          cp "$apk" "$RUNNER_TEMP/familia-noa-7.1.8.apk"
          printf '%s  familia-noa-7.1.8.apk\n' "$actual" > "$RUNNER_TEMP/familia-noa-7.1.8.apk.sha256"
          gh release create v7.1.8 "$RUNNER_TEMP/familia-noa-7.1.8.apk" "$RUNNER_TEMP/familia-noa-7.1.8.apk.sha256" --target "$VERSION_SHA" --title "FAMILIA NOA 7.1.8 · GPS inicial más rápido" --notes "Actualizable sobre 7.1.7 con el mismo paquete y certificado permanente. GPS: muestras cada 1 s solo durante la captura inicial, máximo 30 s sin señal, y actualización inmediata por Supabase Realtime antes de reconciliación en segundo plano. No utiliza ubicaciones históricas. Falta probar el tiempo real en el teléfono. GitHub Actions build 39705604871."
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v7.1.8" --jq '.object.sha')" = "$VERSION_SHA"
          gh release view v7.1.8 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.8.apk
          gh release view v7.1.8 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.8.apk.sha256
      - name: Prune only merged temporary GPS branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FEATURE_SHA" HEAD
          branch='perf/gps-fast-acquisition-718'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$FEATURE_SHA"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
          echo 'Merged 7.1.8 GPS branch deleted. main and HAVANA QUOTES story experiment untouched.'
