name: Validate FAMILIA NOA Web

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build canonical web app
        run: npm run build
      - name: Verify NOA voice client is bundled
        shell: bash
        run: |
          grep -R -q "/api/noa-voice" dist
          grep -R -q "familiaNoaSpeakText" dist
          grep -R -q "cloudflare-workers-ai-melotts" dist
      - name: Verify Worker voice endpoint
        shell: bash
        run: |
          grep -q "@cf/myshell-ai/melotts" worker/index.ts
          grep -q "binding.*AI\|\"binding\": \"AI\"" wrangler.jsonc
          npx wrangler deploy --dry-run --outdir .wrangler-dry
      - name: Enforce Cloudflare static asset limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 25 * 1024 * 1024
          oversized = [(str(p), p.stat().st_size) for p in Path('dist').rglob('*') if p.is_file() and p.stat().st_size > limit]
          if oversized:
              for path, size in oversized:
                  print(f'Oversized Cloudflare asset: {path} ({size} bytes)')
              raise SystemExit(1)
          print('All static assets are within Cloudflare 25 MiB limit.')
          PY
      - name: Verify retired voice code is absent
        shell: bash
        run: |
          if grep -R -q "translate.googleapis.com/translate_tts\|translate.google.com/translate_tts\|webview-streamed-voice" dist; then
            echo "Retired direct network TTS path found in bundle"
            exit 1
          fi
          if grep -R -q "noa-voice-style\|piper-tts-web\|es_MX-claude-high\|TTS-ENGINE" dist; then
            echo "Retired Piper/voice wrapper found in bundle"
            exit 1
          fi
          if find dist -type f -name 'ort-wasm*.wasm' | grep -q .; then
            echo "ONNX WASM must not be bundled into Cloudflare assets"
            exit 1
          fi
