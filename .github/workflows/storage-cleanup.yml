name: Cleanup FAMILIA NOA Actions Storage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/storage-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          artifacts_json="$(mktemp)"
          gh api --paginate --slurp "repos/$repo/actions/artifacts?per_page=100" > "$artifacts_json"

          mapfile -t keep_ids < <(
            jq -r '[.[].artifacts[] | select(.expired == false)] | group_by(.name) | map(sort_by(.created_at) | last | .id)[]?' "$artifacts_json"
          )
          mapfile -t all_ids < <(
            jq -r '.[].artifacts[] | select(.expired == false) | .id' "$artifacts_json"
          )

          deleted_artifacts=0
          for id in "${all_ids[@]}"; do
            keep=0
            for keep_id in "${keep_ids[@]}"; do
              if [[ "$id" == "$keep_id" ]]; then
                keep=1
                break
              fi
            done
            if [[ "$keep" -eq 0 ]]; then
              gh api --method DELETE "repos/$repo/actions/artifacts/$id"
              deleted_artifacts=$((deleted_artifacts + 1))
            fi
          done

          caches_json="$(mktemp)"
          gh api --paginate --slurp "repos/$repo/actions/caches?per_page=100" > "$caches_json"
          mapfile -t cache_ids < <(jq -r '.[].actions_caches[]?.id' "$caches_json")
          deleted_caches=0
          for id in "${cache_ids[@]}"; do
            gh api --method DELETE "repos/$repo/actions/caches/$id"
            deleted_caches=$((deleted_caches + 1))
          done

          echo "Deleted artifacts: $deleted_artifacts"
          echo "Deleted caches: $deleted_caches"
          echo "Kept newest artifact for each artifact name."
