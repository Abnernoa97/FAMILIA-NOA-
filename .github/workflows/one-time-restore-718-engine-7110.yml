name: Archive signed 7.1.10 with proven 7.1.8 GPS motor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-restore-718-engine-7110.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: f111a63b490ae12bc7754a664d984081194bb7e3
      ROLLBACK_SHA: 1e42dcf287d135c297cd2f1cf9775fd22167b4da
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact 7.1.8 source restore and archive signed recovery APK
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          test "$(git show "$RELEASE_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionName = "7.1.10"')" -eq 1
          test "$(git show "$RELEASE_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionCode = 19')" -eq 1
          for path in android-emergency/app/src/main/java/com/familianoa/emergency/FamilyLocationTracker.kt src/main.ts src/core/location-device-sync.ts; do
            test "$(git rev-parse "$RELEASE_SHA:$path")" = "$(git rev-parse "v7.1.8:$path")"
          done
          mkdir -p "$RUNNER_TEMP/familia-noa-recovery"
          gh run download 39715086071 -n familia-noa-permanent-signed-apk -D "$RUNNER_TEMP/familia-noa-recovery"
          mapfile -t files < <(find "$RUNNER_TEMP/familia-noa-recovery" -type f -name app-release.apk)
          test "${#files[@]}" -eq 1
          apk="${files[0]}"
          test -s "$apk"
          test -s "$apk.sha256"
          expected="$(awk 'NR==1 {print $1}' "$apk.sha256")"
          actual="$(sha256sum "$apk" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          target="$RUNNER_TEMP/familia-noa-7.1.10-restaurada-7.1.8.apk"
          cp "$apk" "$target"
          printf '%s  familia-noa-7.1.10-restaurada-7.1.8.apk\n' "$actual" > "$target.sha256"
          gh release create v7.1.10 "$target" "$target.sha256" --target "$RELEASE_SHA" --title "FAMILIA NOA 7.1.10 — GPS restaurado de 7.1.8" --notes "RECUPERACIÓN de la regresión de GPS en 7.1.9. Restituye EXACTAMENTE el motor Android GPS y la activación visual PWA de la 7.1.8 comprobada por el usuario. Numeración Android versionCode 19 para poder instalar sobre 7.1.9 (code 18) sin desinstalar ni perder datos, con firma permanente idéntica. Preserva Supabase, mejoras previas de Realtime/diagnóstico PWA, chat y AYUDA. Sin cambios en administrador o HAVANA QUOTES. El usuario debe confirmar el comportamiento real en sus dos teléfonos. APK compilado y firmado por GitHub Actions 39715086071."
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v7.1.10" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view v7.1.10 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.10-restaurada-7.1.8.apk
          gh release view v7.1.10 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.10-restaurada-7.1.8.apk.sha256
      - name: Remove merged recovery branch, leave all stable branches intact
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ROLLBACK_SHA" HEAD
          branch='fix/restore-718-motor-after-719'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$ROLLBACK_SHA"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
          echo 'Only merged recovery branch deleted; main and experimental stories preserved.'
