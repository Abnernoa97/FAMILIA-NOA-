name: Archive signed GPS 7.1.6 and clean merged branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-archive-gps-716.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_SHA: 5e815802c56ea5a05ee7fa2f4c7360df1d4067e7
      BRANCH_SHA: aa59e9b4224a6921af2378c91b93b5813cac8118
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive checked permanently signed APK
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VERSION_SHA" HEAD
          test "$(git show "$VERSION_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionName = "7.1.6"')" -eq 1
          test "$(git show "$VERSION_SHA:android-emergency/app/build.gradle.kts" | grep -c 'versionCode = 15')" -eq 1
          mkdir -p "$RUNNER_TEMP/gps-716"
          gh run download 39696080614 -n familia-noa-permanent-signed-apk -D "$RUNNER_TEMP/gps-716"
          mapfile -t apks < <(find "$RUNNER_TEMP/gps-716" -type f -name app-release.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test -s "$apk"
          test -s "$apk.sha256"
          expected="$(awk 'NR==1 {print $1}' "$apk.sha256")"
          actual="$(sha256sum "$apk" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          cp "$apk" "$RUNNER_TEMP/familia-noa-7.1.6.apk"
          printf '%s  familia-noa-7.1.6.apk\n' "$actual" > "$RUNNER_TEMP/familia-noa-7.1.6.apk.sha256"
          gh release create v7.1.6 "$RUNNER_TEMP/familia-noa-7.1.6.apk" "$RUNNER_TEMP/familia-noa-7.1.6.apk.sha256" --target "$VERSION_SHA" --title "FAMILIA NOA 7.1.6 · GPS actual y preciso" --notes "APK Android firmado permanentemente, instalable encima de 7.1.5. GPS nativo obtiene muestras actuales y descarta saltos inverosímiles; mapa enseña únicamente posiciones recientes y suficientemente precisas, sin coordenadas históricas. Pruebas reales de precisión y continuidad en segundo plano aún pendientes. Compilación original: GitHub Actions 39696080614."
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v7.1.6" --jq '.object.sha')" = "$VERSION_SHA"
          gh release view v7.1.6 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.6.apk
          gh release view v7.1.6 --json assets --jq '.assets[].name' | grep -qx familia-noa-7.1.6.apk.sha256
      - name: Delete only merged GPS 7.1.6 work branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BRANCH_SHA" HEAD
          branch='fix/gps-current-only-no-history-716'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$BRANCH_SHA"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
          echo 'Removed only merged GPS branch; main and HAVANA QUOTES experiment remain.'
